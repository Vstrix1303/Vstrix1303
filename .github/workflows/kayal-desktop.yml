# Builds the KAYAL desktop app for Windows, macOS and Linux.
# Download the results from the run's "Artifacts" section on the Actions tab.
name: KAYAL desktop app

on:
  push:
    paths:
      - 'kayal-1905/**'
      - '.github/workflows/kayal-desktop.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            cmd: npx electron-builder --win
          - os: macos-latest
            name: macos
            cmd: npx electron-builder --mac
          - os: ubuntu-latest
            name: linux
            cmd: npx electron-builder --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: kayal-1905/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kayal-1905/desktop/package-lock.json
      - run: npm ci
      - run: npm run game
      - run: ${{ matrix.cmd }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Kayal-1905-${{ matrix.name }}
          path: |
            kayal-1905/desktop/dist/*.exe
            kayal-1905/desktop/dist/*.zip
            kayal-1905/desktop/dist/*.dmg
            kayal-1905/desktop/dist/*.AppImage
            kayal-1905/desktop/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
