# Builds the KAYAL desktop app for Windows (installer + portable zip).
# Download the result from the run's "Artifacts" section on the Actions tab.
name: KAYAL desktop app

on:
  push:
    paths:
      - 'kayal-1905/**'
      - '.github/workflows/kayal-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kayal-1905/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kayal-1905/desktop/package-lock.json
      # photo-scanned textures from Poly Haven, kept between runs so they download only once
      - uses: actions/cache@v4
        with:
          path: kayal-1905/desktop/.asset-cache
          key: polyhaven-${{ hashFiles('kayal-1905/assets.json') }}
          restore-keys: polyhaven-
      - run: npm ci
      - run: npm run game
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Kayal-1905-windows
          path: |
            kayal-1905/desktop/dist/*.exe
            kayal-1905/desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30
